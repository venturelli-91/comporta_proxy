services:
  comporta:
    build: .
    ports: ["8080:8080"]
    env_file:
      - path: .env
        required: false
    environment:
      # No default: a known token on a published port would open the dashboard to anyone.
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env (copy .env.example)}
    volumes:
      - dados:/dados
volumes:
  dados: {}
