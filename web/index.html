<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Comporta: an LLM gateway with per-client keys, budgets, caching and LGPD masking of personal data." />
    <title>Comporta</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231b2120'/%3E%3Cpath d='M9 6v20M23 6v20' stroke='white' stroke-width='3'/%3E%3Cpath d='M9 13h14M9 20h14' stroke='%232dd4bf' stroke-width='3.5'/%3E%3C/svg%3E"
    />
    <script>
      // Applies the chosen theme before the first paint (no light flash in dark mode).
      try {
        const t = localStorage.getItem("tema");
        if (t === "claro" || t === "escuro") document.documentElement.dataset.tema = t;
      } catch {}
    </script>
  </head>

    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
