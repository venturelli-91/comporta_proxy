    <script>
      // Aplica o tema escolhido antes da primeira pintura (sem piscar o claro no escuro).

        const t = localStorage.getItem("tema");
        if (t === "claro" || t === "escuro") document.documentElement.dataset.tema = t;
      } catch {}
    </script>
